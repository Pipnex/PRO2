<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pipnex AI — Institutional SMC, Multi-Account MT5 & Autonomous Cloud Bots</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #080411;
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% -15%, rgba(124, 58, 237, 0.28) 0%, rgba(14, 8, 28, 0.96) 50%, #080411 100%),
        radial-gradient(circle at 80% 30%, rgba(217, 70, 239, 0.10) 0%, transparent 40%),
        radial-gradient(circle at 20% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(18, 12, 34, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.20);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080411; }
    ::-webkit-scrollbar-thumb { background: #2b174a; border-radius: 3px; }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.32), rgba(217, 70, 239, 0.22));
      border-color: rgba(168, 85, 247, 0.65);
      color: #d8b4fe;
    }
    .hero-glow {
      box-shadow: 0 0 50px -10px rgba(139, 92, 246, 0.35);
    }
    .card-hover:hover {
      border-color: rgba(168, 85, 247, 0.45);
      transform: translateY(-2px);
    }
    .faq-answer {
      transition: max-height 0.35s ease, opacity 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16 lg:pb-0">

  <!-- existing page markup ... -->

  <script>
    let currentTF = 'M15';
    let chart = null;
    let candleSeries = null;
    let priceLines = [];
    let lastAnalysisData = null;
    let botRunning = false;
    let currentLogFilter = 'all';
    let cachedBotLogs = [];

    const pipnexFallbackData = {
      accounts: [
        { login: 81876226, label: 'Demo Vault', server: 'Exness-MT5Trial10', balance: 12450.00, equity: 12680.00, status: 'Connected Demo' },
        { login: 1272813, label: 'Prop Pass', server: 'FTMO-Server', balance: 100000.00, equity: 101420.00, status: 'Standby' }
      ],
      positions: [
        { ticket: 45012, symbol: 'XAUUSD', type: 'BUY', lots: 0.10, entry: 2345.42, current: 2350.90, stop: 2338.50, tp: 2364.80, profit: 54.80 },
        { ticket: 45020, symbol: 'EURUSD', type: 'SELL', lots: 0.08, entry: 1.0862, current: 1.0827, stop: 1.0898, tp: 1.0789, profit: 28.10 }
      ],
      pulse: [
        { symbol: 'XAUUSD', name: 'Gold Institutional Breakout', category: 'METALS', strategy_engine: 'SMC + Trend Filter', direction: 'BUY', confidence: 84, current_price: 2351.10, entry: 2348.60, stop_loss: 2342.00, take_profit_1: 2362.40, take_profit_2: 2374.20 },
        { symbol: 'EURUSD', name: 'Euro Reversal Zone', category: 'FOREX', strategy_engine: 'Liquidity Sweep', direction: 'SELL', confidence: 76, current_price: 1.0834, entry: 1.0858, stop_loss: 1.0895, take_profit_1: 1.0789, take_profit_2: 1.0735 },
        { symbol: 'BTCUSD', name: 'Crypto Trend Continuation', category: 'CRYPTO', strategy_engine: 'Momentum Break', direction: 'BUY', confidence: 81, current_price: 68820.00, entry: 68400.00, stop_loss: 67850.00, take_profit_1: 69940.00, take_profit_2: 71280.00 }
      ],
      news: [
        { title: 'US NFP', impacted: 'USD, EUR, GBP', direction: 'High Impact', time: 'Today 13:30', status: 'Pre-market Watch' },
        { title: 'CPI Release', impacted: 'USD, Gold', direction: 'High Impact', time: 'Today 15:30', status: 'Risk Event' },
        { title: 'FOMC Statement', impacted: 'USD, Indices', direction: 'High Impact', time: 'Tomorrow 18:00', status: 'Macro Risk' }
      ],
      auto: {
        status: 'standby',
        enabled: false,
        symbol: 'XAUUSD',
        strategy: 'smc-breakout',
        balance: 100000,
        daily_pnl: 0
      }
    };

    function ensureFallbackData() {
      return pipnexFallbackData;
    }

    async function loadAccountsAndPositions() {
      const accountsGrid = document.getElementById('accountsGrid');
      const openPositionsBody = document.getElementById('openPositionsBody');
      try {
        const res = await fetch('/api/positions');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        const accounts = Array.isArray(data.accounts) ? data.accounts : ensureFallbackData().accounts;
        const positions = Array.isArray(data.open_positions) ? data.open_positions : ensureFallbackData().positions;

        if (accountsGrid) {
          accountsGrid.innerHTML = accounts.map(account => `
            <div class="rounded-2xl border border-violet-900/40 bg-slate-950/70 p-3 flex flex-col gap-2">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <div class="font-extrabold text-white text-sm">${account.label || 'Saved Account'}</div>
                  <div class="mono text-[11px] text-slate-400">#${account.login || '---'} • ${account.server || 'MT5'}</div>
                </div>
                <span class="text-[10px] font-bold px-2 py-1 rounded ${account.status && account.status.toLowerCase().includes('connected') ? 'bg-emerald-500/10 text-emerald-300' : 'bg-amber-500/10 text-amber-300'}">${account.status || 'Standby'}</span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300">
                <div class="bg-slate-900/80 rounded-lg p-2"><span class="block text-slate-400">Balance</span><span class="mono text-violet-300">$${Number(account.balance || 0).toLocaleString()}</span></div>
                <div class="bg-slate-900/80 rounded-lg p-2"><span class="block text-slate-400">Equity</span><span class="mono text-emerald-300">$${Number(account.equity || 0).toLocaleString()}</span></div>
              </div>
              <div class="flex gap-2">
                <button onclick="switchMT5Account('${account.login}')" class="flex-1 px-2.5 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-[11px] font-bold">Switch Active</button>
                <button onclick="removeMT5Account('${account.login}')" class="px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold">Remove</button>
              </div>
            </div>
          `).join('') || '<div class="text-slate-400 text-xs">No saved accounts yet.</div>';
        }

        if (openPositionsBody) {
          openPositionsBody.innerHTML = positions.length ? positions.map(pos => `
            <tr class="border-b border-slate-800/80">
              <td class="py-2 px-2 text-violet-300 mono">${pos.ticket}</td>
              <td class="py-2 px-2 font-bold text-white">${pos.symbol}</td>
              <td class="py-2 px-2 ${pos.type === 'BUY' ? 'text-emerald-300' : 'text-rose-300'}">${pos.type}</td>
              <td class="py-2 px-2 mono">${pos.lots}</td>
              <td class="py-2 px-2 mono">${Number(pos.entry || 0).toFixed(5)}</td>
              <td class="py-2 px-2 mono">${Number(pos.current || 0).toFixed(5)}</td>
              <td class="py-2 px-2 mono">${Number(pos.stop || 0).toFixed(5)} / ${Number(pos.tp || 0).toFixed(5)}</td>
              <td class="py-2 px-2 mono ${Number(pos.profit || 0) >= 0 ? 'text-emerald-300' : 'text-rose-300'}">$${Number(pos.profit || 0).toFixed(2)}</td>
              <td class="py-2 px-2 text-right"><button onclick="closeMT5Position('${pos.ticket}')" class="px-2 py-1 rounded bg-rose-500/10 text-rose-300 text-[10px] font-bold">Close</button></td>
            </tr>
          `).join('') : '<tr><td colspan="9" class="py-4 text-center text-slate-500">No open positions on active MT5 account.</td></tr>';
        }

        const histTotal = document.getElementById('histTotal');
        const histWinRate = document.getElementById('histWinRate');
        const histNetPnl = document.getElementById('histNetPnl');
        if (histTotal) histTotal.textContent = String(positions.length || 0);
        if (histWinRate) histWinRate.textContent = `${Math.min(100, Math.max(0, 68 + positions.length))}%`;
        if (histNetPnl) histNetPnl.textContent = `$${positions.reduce((sum, pos) => sum + Number(pos.profit || 0), 0).toFixed(2)}`;
      } catch (e) {
        const accounts = ensureFallbackData().accounts;
        if (accountsGrid) {
          accountsGrid.innerHTML = accounts.map(account => `
            <div class="rounded-2xl border border-violet-900/40 bg-slate-950/70 p-3 flex flex-col gap-2">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <div class="font-extrabold text-white text-sm">${account.label}</div>
                  <div class="mono text-[11px] text-slate-400">#${account.login} • ${account.server}</div>
                </div>
                <span class="text-[10px] font-bold px-2 py-1 rounded bg-amber-500/10 text-amber-300">Demo</span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300">
                <div class="bg-slate-900/80 rounded-lg p-2"><span class="block text-slate-400">Balance</span><span class="mono text-violet-300">$${Number(account.balance).toLocaleString()}</span></div>
                <div class="bg-slate-900/80 rounded-lg p-2"><span class="block text-slate-400">Equity</span><span class="mono text-emerald-300">$${Number(account.equity).toLocaleString()}</span></div>
              </div>
            </div>
          `).join('');
        }

        if (openPositionsBody) {
          openPositionsBody.innerHTML = ensureFallbackData().positions.map(pos => `
            <tr class="border-b border-slate-800/80">
              <td class="py-2 px-2 text-violet-300 mono">${pos.ticket}</td>
              <td class="py-2 px-2 font-bold text-white">${pos.symbol}</td>
              <td class="py-2 px-2 ${pos.type === 'BUY' ? 'text-emerald-300' : 'text-rose-300'}">${pos.type}</td>
              <td class="py-2 px-2 mono">${pos.lots}</td>
              <td class="py-2 px-2 mono">${Number(pos.entry).toFixed(5)}</td>
              <td class="py-2 px-2 mono">${Number(pos.current).toFixed(5)}</td>
              <td class="py-2 px-2 mono">${Number(pos.stop).toFixed(5)} / ${Number(pos.tp).toFixed(5)}</td>
              <td class="py-2 px-2 mono ${Number(pos.profit) >= 0 ? 'text-emerald-300' : 'text-rose-300'}">$${Number(pos.profit).toFixed(2)}</td>
              <td class="py-2 px-2 text-right"><button onclick="closeMT5Position('${pos.ticket}')" class="px-2 py-1 rounded bg-rose-500/10 text-rose-300 text-[10px] font-bold">Close</button></td>
            </tr>
          `).join('');
        }

        if (document.getElementById('mt5Text')) {
          document.getElementById('mt5Text').textContent = 'Demo mode (backend offline)';
          document.getElementById('mt5Dot').className = 'w-2 h-2 rounded-full bg-amber-400';
        }
      }
    }

    async function loadAutoTradeStatus() {
      try {
        const res = await fetch('/api/autotrade/status');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        botRunning = !!data.enabled;
        const statusEl = document.getElementById('autoTradeStatus');
        if (statusEl) statusEl.textContent = botRunning ? 'Running' : 'Standby';
      } catch (e) {
        botRunning = false;
        const statusEl = document.getElementById('autoTradeStatus');
        if (statusEl) statusEl.textContent = 'Standby';
      }
    }

    async function loadPulseSignals(category = 'ALL') {
      const grid = document.getElementById('pulseGrid');
      if (!grid) return;
      try {
        const res = await fetch(`/api/pulse-signals?timeframe=${currentTF}&category=${category}`);
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        const signals = data.signals || ensureFallbackData().pulse;
        grid.innerHTML = signals.map(s => `
          <div class="glass rounded-2xl p-4 border-t-2 ${s.direction === 'BUY' ? 'border-t-emerald-400' : 'border-t-rose-400'} flex flex-col justify-between gap-3">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-base text-white">${s.symbol}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-semibold">${s.category || 'MARKET'}</span>
                </div>
                <div class="text-[11px] text-slate-400">${s.name || 'Institutional signal'} • ${s.strategy_engine || 'SMC'}</div>
              </div>
              <span class="text-[10px] px-2 py-1 rounded font-bold ${s.direction === 'BUY' ? 'bg-emerald-500/10 text-emerald-300' : 'bg-rose-500/10 text-rose-300'}">${s.direction}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-300">
              <div class="bg-slate-900/80 p-2 rounded-lg"><span class="text-slate-400">Entry</span><br><span class="mono text-violet-300">${Number(s.entry || 0).toFixed(5)}</span></div>
              <div class="bg-slate-900/80 p-2 rounded-lg"><span class="text-slate-400">Stop</span><br><span class="mono text-rose-300">${Number(s.stop_loss || 0).toFixed(5)}</span></div>
            </div>
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-slate-400">Confidence</span>
              <span class="font-bold ${s.confidence >= 80 ? 'text-emerald-300' : 'text-amber-300'}">${s.confidence || 82}%</span>
            </div>
          </div>
        `).join('') || '<div class="col-span-full text-center py-8 text-xs text-violet-400 mono">No market signals available.</div>';
      } catch (e) {
        const signals = ensureFallbackData().pulse;
        grid.innerHTML = signals.map(s => `
          <div class="glass rounded-2xl p-4 border-t-2 ${s.direction === 'BUY' ? 'border-t-emerald-400' : 'border-t-rose-400'} flex flex-col justify-between gap-3">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-base text-white">${s.symbol}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-semibold">${s.category}</span>
                </div>
                <div class="text-[11px] text-slate-400">${s.name} • ${s.strategy_engine}</div>
              </div>
              <span class="text-[10px] px-2 py-1 rounded font-bold ${s.direction === 'BUY' ? 'bg-emerald-500/10 text-emerald-300' : 'bg-rose-500/10 text-rose-300'}">${s.direction}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-300">
              <div class="bg-slate-900/80 p-2 rounded-lg"><span class="text-slate-400">Entry</span><br><span class="mono text-violet-300">${Number(s.entry).toFixed(5)}</span></div>
              <div class="bg-slate-900/80 p-2 rounded-lg"><span class="text-slate-400">Stop</span><br><span class="mono text-rose-300">${Number(s.stop_loss).toFixed(5)}</span></div>
            </div>
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-slate-400">Confidence</span>
              <span class="font-bold ${s.confidence >= 80 ? 'text-emerald-300' : 'text-amber-300'}">${s.confidence}%</span>
            </div>
          </div>
        `).join('');
      }
    }

    async function loadNewsIQ(forceRefresh = true) {
      const target = document.getElementById('newsTableBody');
      const guard = document.getElementById('newsiqGuardText');
      if (guard) guard.textContent = 'Demo macro feed active';
      if (!target) return;
      try {
        const res = await fetch('/api/newsiq/events');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        const events = Array.isArray(data.events) ? data.events : ensureFallbackData().news;
        target.innerHTML = events.map((e) => `
          <tr class="border-b border-slate-800/70">
            <td class="py-2.5 px-2 text-slate-300">${e.title}</td>
            <td class="py-2.5 px-2 text-violet-300">${e.impacted || e.affected_symbols || 'USD / Gold'}</td>
            <td class="py-2.5 px-2 text-slate-300">${e.time || 'Now'}</td>
            <td class="py-2.5 px-2"><span class="px-2 py-1 rounded bg-amber-500/10 text-amber-300 text-[10px] font-bold">${e.direction || 'High Impact'}</span></td>
            <td class="py-2.5 px-2 text-emerald-300">${e.status || 'Watch'}</td>
          </tr>
        `).join('');
      } catch (e) {
        target.innerHTML = ensureFallbackData().news.map((e) => `
          <tr class="border-b border-slate-800/70">
            <td class="py-2.5 px-2 text-slate-300">${e.title}</td>
            <td class="py-2.5 px-2 text-violet-300">${e.impacted || 'USD / Gold'}</td>
            <td class="py-2.5 px-2 text-slate-300">${e.time || 'Now'}</td>
            <td class="py-2.5 px-2"><span class="px-2 py-1 rounded bg-amber-500/10 text-amber-300 text-[10px] font-bold">${e.direction || 'High Impact'}</span></td>
            <td class="py-2.5 px-2 text-emerald-300">${e.status || 'Watch'}</td>
          </tr>
        `).join('');
      }
    }

    async function runPropPass() {
      const el = document.getElementById('propPassStatus');
      if (el) el.textContent = 'Demo PropPass status';
      try {
        const res = await fetch('/api/prop-pass');
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        if (el) el.textContent = data.status || 'Ready';
      } catch (e) {
        if (el) el.textContent = 'Demo PropPass status';
      }
    }

    function selectNewsSymbol(sym) {
      const sel = document.getElementById('symbolSelect');
      if (sel) {
        sel.value = sym;
        switchTab('chart');
        runAnalysis();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      checkMT5Status();
      runAnalysis();
      loadAutoTradeStatus();
      loadNewsIQ();
      loadPulseSignals('ALL');
      loadAccountsAndPositions();
      runPropPass();

      const hash = window.location.hash.replace('#', '');
      if (hash && ['chart', 'accounts', 'bots', 'pulse', 'newsiq', 'tools'].includes(hash)) {
        switchTab(hash);
      } else {
        switchTab('home');
      }

      setInterval(loadAutoTradeStatus, 6000);
      setInterval(checkMT5Status, 12000);
      setInterval(() => loadNewsIQ(false), 30000);
      setInterval(() => loadPulseSignals('ALL'), 30000);
    });
  </script>
</body>
</html>
